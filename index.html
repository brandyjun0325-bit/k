<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>수업 설계 파트너 - 자동 설계 데모</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Pretendard:wght@400;600;700&display=swap');
    body { font-family: 'Pretendard', sans-serif; background: #f8fafc; }
  </style>
</head>
<body class="text-slate-900">
  <header class="bg-slate-900 text-white">
    <div class="max-w-6xl mx-auto px-6 py-10">
      <p class="text-xs uppercase tracking-[0.35em] text-blue-200">Before Class</p>
      <h1 class="mt-2 text-3xl sm:text-4xl font-bold">과목과 수업 내용만 입력하면, 수업 설계가 자동 완성됩니다.</h1>
      <p class="mt-4 text-slate-200 max-w-3xl">차시 설계(도입·전개·정리), 수준별 자료, 활동 아이디어, 에듀테크 연계 자료를 한 번에 생성하는 수업 설계 파트너 데모입니다.</p>
    </div>
  </header>

  <main class="max-w-6xl mx-auto px-6 py-10 grid gap-8 lg:grid-cols-[0.95fr_1.05fr]">
    <section class="bg-white border border-slate-200 rounded-3xl p-6 shadow-sm">
      <h2 class="text-xl font-bold">수업 정보 입력</h2>
      <p class="text-sm text-slate-500 mt-1">아래 항목을 넣으면 자동으로 수업안을 생성합니다.</p>

      <form id="plannerForm" class="mt-6 space-y-4">
        <div>
          <label for="subject" class="block text-sm font-semibold">과목</label>
          <input id="subject" name="subject" required placeholder="예: 사회" class="mt-1 w-full border border-slate-300 rounded-xl px-3 py-2.5 outline-none focus:ring-2 focus:ring-blue-400" />
        </div>
        <div>
          <label for="lessonTopic" class="block text-sm font-semibold">수업 내용</label>
          <textarea id="lessonTopic" name="lessonTopic" rows="3" required placeholder="예: 도시와 농촌의 생활 모습 비교" class="mt-1 w-full border border-slate-300 rounded-xl px-3 py-2.5 outline-none focus:ring-2 focus:ring-blue-400"></textarea>
        </div>
        <div class="grid sm:grid-cols-2 gap-4">
          <div>
            <label for="grade" class="block text-sm font-semibold">학년(선택)</label>
            <input id="grade" name="grade" placeholder="예: 중1" class="mt-1 w-full border border-slate-300 rounded-xl px-3 py-2.5 outline-none focus:ring-2 focus:ring-blue-400" />
          </div>
          <div>
            <label for="achievement" class="block text-sm font-semibold">성취기준(선택)</label>
            <input id="achievement" name="achievement" placeholder="예: [9사(지리)01-01]" class="mt-1 w-full border border-slate-300 rounded-xl px-3 py-2.5 outline-none focus:ring-2 focus:ring-blue-400" />
          </div>
        </div>

        <button type="submit" class="w-full bg-blue-500 hover:bg-blue-400 text-white font-semibold py-3 rounded-xl transition">자동 수업 설계 생성</button>
      </form>
    </section>

    <section id="result" class="bg-white border border-slate-200 rounded-3xl p-6 shadow-sm">
      <h2 class="text-xl font-bold">자동 생성 결과</h2>
      <p id="resultGuide" class="text-sm text-slate-500 mt-1">아직 생성된 수업안이 없습니다. 왼쪽 폼을 입력해 주세요.</p>

      <div id="resultContent" class="hidden mt-6 space-y-6">
        <div class="bg-slate-50 rounded-2xl p-4">
          <p class="text-xs text-slate-500">수업 타이틀</p>
          <h3 id="lessonTitle" class="font-bold mt-1"></h3>
          <p id="lessonMeta" class="text-sm text-slate-600 mt-1"></p>
        </div>

        <div class="grid gap-3">
          <h4 class="font-semibold">1) 차시 설계 (도입–전개–정리)</h4>
          <div id="phasePlan" class="grid md:grid-cols-3 gap-3 text-sm"></div>
        </div>

        <div>
          <h4 class="font-semibold">2) 수준별 자료</h4>
          <ul id="levelMaterials" class="mt-2 space-y-2 text-sm"></ul>
        </div>

        <div>
          <h4 class="font-semibold">3) 활동 아이디어 뱅크</h4>
          <ul id="activityIdeas" class="mt-2 space-y-2 text-sm"></ul>
        </div>

        <div>
          <h4 class="font-semibold">4) 에듀테크 연계</h4>
          <ul id="edutechIdeas" class="mt-2 space-y-2 text-sm"></ul>
        </div>
      </div>
    </section>
  </main>

  <script>
    const plannerForm = document.getElementById('plannerForm');
    const resultGuide = document.getElementById('resultGuide');
    const resultContent = document.getElementById('resultContent');
    const lessonTitle = document.getElementById('lessonTitle');
    const lessonMeta = document.getElementById('lessonMeta');
    const phasePlan = document.getElementById('phasePlan');
    const levelMaterials = document.getElementById('levelMaterials');
    const activityIdeas = document.getElementById('activityIdeas');
    const edutechIdeas = document.getElementById('edutechIdeas');

    function renderCard(title, text) {
      return `<div class="bg-slate-50 border border-slate-200 rounded-xl p-3"><p class="text-xs text-blue-600 font-semibold">${title}</p><p class="mt-1 text-slate-700">${text}</p></div>`;
    }

    function renderList(items) {
      return items
        .map((item) => `<li class="bg-slate-50 border border-slate-200 rounded-xl px-3 py-2">${item}</li>`)
        .join('');
    }

    plannerForm.addEventListener('submit', (event) => {
      event.preventDefault();
      const formData = new FormData(plannerForm);

      const subject = String(formData.get('subject') || '').trim();
      const topic = String(formData.get('lessonTopic') || '').trim();
      const grade = String(formData.get('grade') || '').trim();
      const achievement = String(formData.get('achievement') || '').trim();

      const gradeText = grade ? `${grade} ` : '';
      lessonTitle.textContent = `[${subject}] ${topic}`;
      lessonMeta.textContent = `${gradeText}${achievement ? `| 성취기준: ${achievement}` : '| 성취기준: 입력 기반 자동 해석'}`;

      phasePlan.innerHTML = [
        renderCard('도입', `${topic}와 관련된 일상 사례/이미지 퀴즈 3문항으로 학습 동기를 유발하고 학습 목표를 공유합니다.`),
        renderCard('전개', `${subject} 핵심 개념을 설명한 뒤, 짝/모둠 활동으로 ${topic} 비교·분석 과제를 수행합니다.`),
        renderCard('정리', `출구 티켓(한 줄 정리 + 자기평가)으로 이해도를 확인하고 다음 차시와 연결합니다.`)
      ].join('');

      levelMaterials.innerHTML = renderList([
        `<b>기초</b>: 핵심 용어 카드 + 빈칸 채우기 학습지 (${topic} 기본 개념 중심)`,
        `<b>보통</b>: 자료 해석 문제 + 서술형 2문항 (핵심 개념 적용)`,
        `<b>심화</b>: 실제 사례 확장 탐구 및 주장-근거 글쓰기 (비판적 사고 강화)`
      ]);

      activityIdeas.innerHTML = renderList([
        `토의 질문: "${topic}가 우리 생활에 미치는 가장 큰 영향은 무엇인가?"`,
        `프로젝트 주제: "우리 지역 사례로 보는 ${topic}" 인포그래픽 제작`,
        `게임형 활동: 개념 카드 매칭 레이스 + 미션 퀴즈 챌린지`
      ]);

      edutechIdeas.innerHTML = renderList([
        `퀴즈: 핵심 개념 자동 퀴즈(객관식 5 + 단답형 2)`,
        `시뮬레이션: 변수 변경형 미니 시뮬레이션으로 ${topic} 결과 비교`,
        `디지털 워크시트: 자동 채점 + 피드백 문장 추천 기능 포함`
      ]);

      resultGuide.classList.add('hidden');
      resultContent.classList.remove('hidden');
      document.getElementById('result').scrollIntoView({ behavior: 'smooth', block: 'start' });
    });
  </script>
</body>
</html>
