<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>표적 퀴즈 게임</title>
  <style>
    :root {
      --bg: #0f172a;
      --panel: #1e293b;
      --accent: #38bdf8;
      --text: #e2e8f0;
      --ok: #22c55e;
      --bad: #ef4444;
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Pretendard", system-ui, -apple-system, sans-serif;
      background: radial-gradient(circle at top, #1e293b 0%, #0f172a 55%);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      padding: 24px;
    }

    .card {
      width: min(980px, 100%);
      background: rgba(15, 23, 42, 0.75);
      border: 1px solid rgba(148, 163, 184, 0.25);
      border-radius: 18px;
      padding: 22px;
      backdrop-filter: blur(3px);
    }

    h1 { margin: 0 0 8px; font-size: 1.9rem; }
    p { margin: 0; color: #cbd5e1; }

    .hidden { display: none !important; }

    textarea {
      width: 100%;
      min-height: 210px;
      border-radius: 14px;
      border: 1px solid #334155;
      background: #0b1120;
      color: #e2e8f0;
      font-size: 0.95rem;
      padding: 14px;
      margin-top: 16px;
    }

    button {
      border: 0;
      border-radius: 12px;
      padding: 11px 18px;
      font-weight: 700;
      cursor: pointer;
      transition: transform .08s ease, opacity .2s ease;
    }
    button:active { transform: scale(.98); }

    .primary { background: var(--accent); color: #042f4a; }
    .secondary { background: #334155; color: #e2e8f0; }

    .actions { margin-top: 14px; display: flex; gap: 10px; flex-wrap: wrap; }

    .hud {
      display: grid;
      grid-template-columns: repeat(3, minmax(0,1fr));
      gap: 10px;
      margin: 16px 0;
    }
    .hud-box {
      background: #0b1120;
      border: 1px solid #334155;
      border-radius: 12px;
      padding: 10px;
      text-align: center;
    }

    .question-box {
      border: 1px solid #334155;
      background: #0b1120;
      border-radius: 12px;
      padding: 14px;
      font-size: 1.2rem;
      min-height: 64px;
      margin-bottom: 12px;
    }

    #arena {
      position: relative;
      width: 100%;
      height: 460px;
      border: 1px solid #334155;
      border-radius: 14px;
      overflow: hidden;
      background: linear-gradient(180deg, #0b1120 0%, #0f172a 100%);
    }

    .target {
      position: absolute;
      width: 84px;
      height: 84px;
      border-radius: 999px;
      border: 2px solid #e2e8f0;
      display: grid;
      place-items: center;
      color: #f8fafc;
      font-weight: 800;
      font-size: 1.2rem;
      user-select: none;
      box-shadow: 0 10px 18px rgba(2,6,23,.45);
    }
    .target.good {
      background: radial-gradient(circle at 35% 30%, #bef264, #15803d 70%);
    }
    .target.bad {
      background: radial-gradient(circle at 35% 30%, #fda4af, #b91c1c 70%);
    }

    #message { margin-top: 10px; min-height: 24px; font-weight: 700; }
    #message.ok { color: var(--ok); }
    #message.bad { color: var(--bad); }

    .result {
      margin-top: 14px;
      border: 1px dashed #475569;
      border-radius: 12px;
      padding: 12px;
      color: #e2e8f0;
    }
  </style>
</head>
<body>
  <div class="card">
    <section id="setupScreen">
      <h1>🎯 표적 퀴즈 게임</h1>
      <p>문제를 입력하고 시작하면 정답 표적을 맞추는 게임이 시작됩니다.</p>
      <textarea id="problemInput" placeholder="형식: 문제=정답\n예시:\n5+3=8\n대한민국 수도=서울\n영어로 사과=apple"></textarea>
      <div class="actions">
        <button class="primary" id="startBtn">게임 시작</button>
        <button class="secondary" id="sampleBtn">예시 채우기</button>
      </div>
      <p id="setupError" style="color:#fda4af;margin-top:10px;"></p>
    </section>

    <section id="gameScreen" class="hidden">
      <h1>문제를 보고 정답 표적을 맞히세요!</h1>
      <div class="hud">
        <div class="hud-box">점수<br /><strong id="score">0</strong></div>
        <div class="hud-box">라운드<br /><strong id="round">0</strong></div>
        <div class="hud-box">남은 문제<br /><strong id="leftCount">0</strong></div>
      </div>

      <div class="question-box" id="questionText">문제 준비 중...</div>
      <div id="arena"></div>
      <div id="message"></div>

      <div class="actions" style="margin-top:14px;">
        <button class="secondary" id="endBtn">종료하고 다시 입력</button>
      </div>

      <div class="result hidden" id="resultBox"></div>
    </section>
  </div>

  <script>
    const setupScreen = document.getElementById("setupScreen");
    const gameScreen = document.getElementById("gameScreen");
    const problemInput = document.getElementById("problemInput");
    const setupError = document.getElementById("setupError");
    const startBtn = document.getElementById("startBtn");
    const sampleBtn = document.getElementById("sampleBtn");
    const endBtn = document.getElementById("endBtn");

    const scoreEl = document.getElementById("score");
    const roundEl = document.getElementById("round");
    const leftCountEl = document.getElementById("leftCount");
    const questionTextEl = document.getElementById("questionText");
    const arenaEl = document.getElementById("arena");
    const messageEl = document.getElementById("message");
    const resultBoxEl = document.getElementById("resultBox");

    let quiz = [];
    let pending = [];
    let current = null;
    let score = 0;
    let round = 0;

    const moveIntervals = new Set();

    function parseProblems(text) {
      return text
        .split("\n")
        .map((line) => line.trim())
        .filter(Boolean)
        .map((line) => {
          const divider = line.includes("=") ? "=" : line.includes("|") ? "|" : null;
          if (!divider) return null;
          const [q, a] = line.split(divider).map((v) => v.trim());
          if (!q || !a) return null;
          return { q, a };
        })
        .filter(Boolean);
    }

    function shuffle(arr) {
      for (let i = arr.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [arr[i], arr[j]] = [arr[j], arr[i]];
      }
      return arr;
    }

    function clearTargets() {
      moveIntervals.forEach((timer) => clearInterval(timer));
      moveIntervals.clear();
      arenaEl.innerHTML = "";
    }

    function updateHud() {
      scoreEl.textContent = String(score);
      roundEl.textContent = String(round);
      leftCountEl.textContent = String(pending.length);
    }

    function popMessage(text, type = "") {
      messageEl.textContent = text;
      messageEl.className = "";
      if (type) messageEl.classList.add(type);
    }

    function nextRound() {
      clearTargets();
      resultBoxEl.classList.add("hidden");

      if (!pending.length) {
        questionTextEl.textContent = "게임 종료!";
        popMessage("모든 문제를 완료했습니다.", "ok");
        resultBoxEl.classList.remove("hidden");
        resultBoxEl.innerHTML = `최종 점수: <strong>${score}</strong> / ${quiz.length}`;
        return;
      }

      round += 1;
      current = pending.shift();
      questionTextEl.textContent = `Q${round}. ${current.q}`;

      const answers = [current.a];
      const otherAnswers = shuffle(
        quiz
          .map((item) => item.a)
          .filter((a) => a !== current.a)
      ).slice(0, 3);
      answers.push(...otherAnswers);

      while (answers.length < 4) {
        answers.push(String(Math.floor(Math.random() * 20) + 1));
      }

      shuffle(answers).forEach((answer) => {
        const isCorrect = answer === current.a;
        spawnTarget(answer, isCorrect);
      });

      updateHud();
    }

    function spawnTarget(label, isCorrect) {
      const target = document.createElement("button");
      target.className = `target ${isCorrect ? "good" : "bad"}`;
      target.textContent = label;
      target.setAttribute("type", "button");

      const maxX = arenaEl.clientWidth - 84;
      const maxY = arenaEl.clientHeight - 84;
      let x = Math.random() * maxX;
      let y = Math.random() * maxY;

      function draw() {
        target.style.transform = `translate(${x}px, ${y}px)`;
      }

      draw();

      const timer = setInterval(() => {
        x += (Math.random() - 0.5) * 90;
        y += (Math.random() - 0.5) * 90;
        x = Math.max(0, Math.min(maxX, x));
        y = Math.max(0, Math.min(maxY, y));
        draw();
      }, 650);
      moveIntervals.add(timer);

      target.addEventListener("click", () => {
        if (isCorrect) {
          score += 1;
          popMessage("정답! 점수 +1", "ok");
          nextRound();
        } else {
          popMessage("오답! 정답 표적을 다시 찾아보세요.", "bad");
        }
        updateHud();
      });

      arenaEl.appendChild(target);
    }

    function startGame() {
      const parsed = parseProblems(problemInput.value);
      if (parsed.length < 1) {
        setupError.textContent = "문제를 최소 1개 이상 올바른 형식(문제=정답)으로 입력해 주세요.";
        return;
      }

      setupError.textContent = "";
      quiz = parsed;
      pending = shuffle([...quiz]);
      current = null;
      score = 0;
      round = 0;

      setupScreen.classList.add("hidden");
      gameScreen.classList.remove("hidden");
      popMessage("게임이 시작되었습니다!");
      updateHud();
      nextRound();
    }

    function resetToSetup() {
      clearTargets();
      gameScreen.classList.add("hidden");
      setupScreen.classList.remove("hidden");
      popMessage("");
      resultBoxEl.classList.add("hidden");
    }

    sampleBtn.addEventListener("click", () => {
      problemInput.value = [
        "7+5=12",
        "10-4=6",
        "한국의 수도=서울",
        "영어로 바나나=banana",
        "물의 화학식=H2O"
      ].join("\n");
    });

    startBtn.addEventListener("click", startGame);
    endBtn.addEventListener("click", resetToSetup);
  </script>
</body>
</html>
